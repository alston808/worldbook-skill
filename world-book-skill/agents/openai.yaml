name: world-book-create
display_name: Character Card / World Book Management Assistant
short_description: Create and manage SillyTavern Character Cards and World Books
description: >-
  Character Card / World Book Management Assistant - helps users create and manage
  SillyTavern character cards and world books through interactive conversation.
  Supports character card writing (profile/personality/worldview/opening), world book creation,
  light novel/game conversion, writing style extraction, and item/ability settings.
  Optional MVU ZOD variable system and HTML frontend beautification are available
  only when explicitly requested by the user.
  HTML beautification has three modes: A=status bar with MVU / B=status bar without MVU / C=global beautification wrapper.
  Integrates card-generator.py to produce chara_card_v3 character card JSON.
default_prompt: |
  Before starting, first determine task type (character card / world book / conversion / MVU / HTML / global beautification).

  Character card tasks: read references/character-card-guide.md and self-check with the DoubleCheck quality checklist.
  World book tasks: read the scenario router in references/guide.md, then follow it to read the matching reference files.
  HTML beautification: read references/html-beautify-guide.md and decide mode based on user intent (status bar only / global beautification / both).
  Global beautification: create a D0 keep entry (position=4, depth=0); regex order must be status bar first, global second.

  Use scripts/world-book-create.py to manage world book entries.
  Use scripts/query.py to view and search world book entries.
  Use scripts/card-generator.py to generate and validate character card JSON.

  Content format: XML wrapping YAML. After all entries are written, scan each entry against references/writing-optimization-guide.md for self-checking - never write forbidden words into the world book.
  MVU, HTML, and global beautification are enabled only when the user explicitly requests them; never suggest them proactively.
